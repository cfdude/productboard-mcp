name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main, dev]


permissions:
  contents: read

jobs:
  claude-review:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@28f83620103c48a57093dcc2837eec89e036bb9f  # beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          
          # Direct prompt for automated review (no @claude mention needed)
          direct_prompt: |
            Please review this pull request and provide feedback on:
            - TypeScript type safety and best practices
            - API error handling and security concerns
            - Code organization and structure
            - Performance considerations
            - Documentation completeness
            - Test coverage and quality
            
            Focus on files in src/ and scripts/ directories. Be constructive and helpful in your feedback.
